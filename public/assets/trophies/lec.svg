<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
  <!-- LEC: lâminas verde-água em degraus, a mais alta à direita, sobre a base preta -->
  <defs>
    <linearGradient id="t" x1="0" x2="1">
      <stop offset="0" stop-color="#0d5f5b"/>
      <stop offset=".45" stop-color="#7ff3e4"/>
      <stop offset=".7" stop-color="#2fc2b4"/>
      <stop offset="1" stop-color="#0b4b48"/>
    </linearGradient>
    <linearGradient id="t2" x1="1" x2="0">
      <stop offset="0" stop-color="#0a3f3d"/>
      <stop offset=".5" stop-color="#4fd8c8"/>
      <stop offset="1" stop-color="#0e5552"/>
    </linearGradient>
    <linearGradient id="k" x1="0" x2="1">
      <stop offset="0" stop-color="#050708"/>
      <stop offset=".4" stop-color="#1f2b2c"/>
      <stop offset=".55" stop-color="#2c6f69"/>
      <stop offset=".7" stop-color="#121a1b"/>
      <stop offset="1" stop-color="#040506"/>
    </linearGradient>
  </defs>
  <!-- lâminas, da mais baixa (esquerda) à mais alta (direita) -->
  <path d="M34 64 L42 60 L42 108 L36 108 Z" fill="url(#t2)"/>
  <path d="M39 50 L47 46 L47 108 L40 108 Z" fill="url(#t)"/>
  <path d="M45 36 L53 32 L53 108 L46 108 Z" fill="url(#t2)"/>
  <path d="M51 22 L59 18 L59 108 L52 108 Z" fill="url(#t)"/>
  <path d="M57 8 L65 4 L66 108 L58 108 Z" fill="url(#t2)"/>
  <path d="M62 4 L68 6 L68 108 L64 108 Z" fill="url(#t)"/>
  <!-- brilhos -->
  <path d="M60 10 L60 100 M54 24 L54 100 M48 38 L48 100" stroke="#d4fff8" stroke-width="1" opacity=".55"/>
  <path d="M40 70 L58 74 L58 92 L40 88 Z" fill="#a6fff2" opacity=".18"/>
  <!-- base preta redonda -->
  <path d="M33 108 L69 108 L72 130 L30 130 Z" fill="url(#k)"/>
  <ellipse cx="51" cy="108" rx="18" ry="2.5" fill="#2c6f69" opacity=".8"/>
  <ellipse cx="51" cy="130" rx="21" ry="3" fill="#0a0d0e"/>
  <path d="M46 114 L50 126 L54 114 L52 118 L50 122 L48 118 Z" fill="#3fd3c3" opacity=".7"/>
</svg>
