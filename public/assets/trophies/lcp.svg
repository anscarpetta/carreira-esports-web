  <path d="M36 10 L44 26 L42 36 L32 32 Z" fill="url(#sv)"/>
  <path d="M64 10 L56 26 L58 36 L68 32 Z" fill="url(#sv)"/>
  <path d="M24 18 L34 30 L30 38 L24 32 Z" fill="url(#cu)"/>
  <path d="M76 18 L66 30 L70 38 L76 32 Z" fill="url(#cu)"/>
  <path d="M46 10 L50 4 L52 22" stroke="#ffffff" stroke-width="1" fill="none" opacity=".6"/>
  <!-- veios de lava -->
  <path d="M52 30 L48 46 L54 58 L49 72 L53 86 L48 100 L52 114" stroke="#ff9a3c" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
  <path d="M52 30 L48 46 L54 58 L49 72 L53 86 L48 100 L52 114" stroke="#ffe0a8" stroke-width=".8" fill="none" stroke-linejoin="round"/>
  <path d="M40 40 L44 54 L41 64" stroke="#ff8a2a" stroke-width="1.4" fill="none" opacity=".8"/>
