    <linearGradient id="d" x1="0" x2="1">
      <stop offset="0" stop-color="#3a2a24"/>
      <stop offset=".25" stop-color="#c47a4c"/>
      <stop offset=".45" stop-color="#2b2d33"/>
      <stop offset=".6" stop-color="#5d6470"/>
      <stop offset=".8" stop-color="#2a2c31"/>
      <stop offset="1" stop-color="#a35e38"/>
    </linearGradient>
    <linearGradient id="sv" x1="0" x2="1">
      <stop offset="0" stop-color="#5a606b"/>
      <stop offset=".45" stop-color="#e8ebf0"/>
      <stop offset="1" stop-color="#6b717c"/>
    </linearGradient>
    <linearGradient id="cu" x1="0" x2="1">
      <stop offset="0" stop-color="#7a3d1e"/>
      <stop offset=".5" stop-color="#e59a62"/>
      <stop offset="1" stop-color="#6b3418"/>
    </linearGradient>
