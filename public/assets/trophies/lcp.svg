  <!-- corpo em ampulheta -->
  <path d="M28 30 L72 30 C66 50 58 64 58 82 C58 98 64 108 70 116 L30 116 C36 108 42 98 42 82 C42 64 34 50 28 30 Z" fill="url(#d)"/>
