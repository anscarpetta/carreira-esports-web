<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
  <!-- LPL: Taça do Dragão de Prata, com tampa, medalhão e dois dragões como alças -->
  <defs>
    <linearGradient id="p" x1="0" x2="1">
      <stop offset="0" stop-color="#80858e"/>
      <stop offset=".35" stop-color="#f6f7f9"/>
      <stop offset=".65" stop-color="#c4c8cf"/>
      <stop offset="1" stop-color="#9a8f95"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" x2="1">
      <stop offset="0" stop-color="#6c7078"/>
      <stop offset=".5" stop-color="#dfe2e6"/>
      <stop offset="1" stop-color="#7a7279"/>
    </linearGradient>
    <linearGradient id="dl" x1="0" x2="1">
      <stop offset="0" stop-color="#6f747d"/>
      <stop offset=".5" stop-color="#e9ebef"/>
      <stop offset="1" stop-color="#9aa0a9"/>
    </linearGradient>
    <linearGradient id="dr" x1="0" x2="1">
      <stop offset="0" stop-color="#c9a6b2"/>
      <stop offset=".5" stop-color="#f6e4ea"/>
      <stop offset="1" stop-color="#a77f8c"/>
    </linearGradient>
  </defs>
  <!-- tampa -->
  <rect x="44" y="6" width="12" height="5" rx="2" fill="url(#p2)"/>
  <path d="M34 12 L66 12 L70 18 L30 18 Z" fill="url(#p)"/>
  <!-- bojo -->
  <path d="M30 18 L70 18 L68 52 C66 66 58 74 50 76 C42 74 34 66 32 52 Z" fill="url(#p)"/>
  <path d="M36 22 C36 44 40 60 46 70" stroke="#ffffff" stroke-width="2" fill="none" opacity=".55" stroke-linecap="round"/>
  <path d="M34 50 L50 58 L66 50" stroke="#8d929b" stroke-width="1" fill="none" opacity=".6"/>
  <!-- medalhão -->
  <circle cx="50" cy="36" r="8" fill="url(#p2)"/>
  <circle cx="50" cy="36" r="6" fill="none" stroke="#8d929b" stroke-width="1"/>
  <path d="M45 39 L49 32 L55 33 L51 36 L55 40 Z" fill="#7b8089"/>
  <!-- dragões (alças) -->
  <path d="M30 22 C22 16 14 18 12 24 C16 22 20 23 22 26 C14 30 14 42 22 48 C18 56 20 66 30 72 C26 64 26 58 30 54 C24 48 24 38 30 34 Z" fill="url(#dl)"/>
  <path d="M12 24 L8 20 L14 21 M18 18 L17 12 L21 17" stroke="#9aa0a9" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M20 32 L16 34 M20 40 L15 41 M22 56 L18 60" stroke="#8a9099" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M70 22 C78 16 86 18 88 24 C84 22 80 23 78 26 C86 30 86 42 78 48 C82 56 80 66 70 72 C74 64 74 58 70 54 C76 48 76 38 70 34 Z" fill="url(#dr)"/>
  <path d="M88 24 L92 20 L86 21 M82 18 L83 12 L79 17" stroke="#b98d9b" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M80 32 L84 34 M80 40 L85 41 M78 56 L82 60" stroke="#a77f8c" stroke-width="1.2" stroke-linecap="round"/>
  <!-- pé e pedestal -->
  <path d="M45 76 L55 76 L56 88 L44 88 Z" fill="url(#p2)"/>
  <path d="M36 88 L64 88 L68 98 L32 98 Z" fill="url(#p)"/>
  <rect x="26" y="98" width="48" height="26" rx="1.5" fill="url(#p)"/>
  <rect x="36" y="104" width="28" height="12" rx="1" fill="url(#p2)" stroke="#9aa0a9" stroke-width=".8"/>
  <rect x="23" y="124" width="54" height="7" rx="1.5" fill="url(#p2)"/>
</svg>
