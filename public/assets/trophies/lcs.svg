      <stop offset="0" stop-color="#4e5566"/>
      <stop offset=".35" stop-color="#f1f3f8"/>
      <stop offset=".6" stop-color="#a9b0c0"/>
      <stop offset="1" stop-color="#434958"/>
    </linearGradient>
    <linearGradient id="m2" x1="1" x2="0">
      <stop offset="0" stop-color="#3f4554"/>
      <stop offset=".5" stop-color="#d7dbe5"/>
      <stop offset="1" stop-color="#555c6d"/>
    </linearGradient>
    <linearGradient id="cr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3d0ff"/>
      <stop offset=".45" stop-color="#4f63f0"/>
