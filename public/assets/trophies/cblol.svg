<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
  <!-- CBLOL: leque de lâminas cromadas sobre hastes vermelhas cruzadas e base quadrada -->
  <defs>
    <linearGradient id="c" x1="0" x2="1">
      <stop offset="0" stop-color="#6f7680"/>
      <stop offset=".4" stop-color="#f2f4f7"/>
      <stop offset=".7" stop-color="#b9bfc8"/>
      <stop offset="1" stop-color="#5d636c"/>
    </linearGradient>
    <linearGradient id="c2" x1="1" x2="0">
      <stop offset="0" stop-color="#6f7680"/>
      <stop offset=".5" stop-color="#dfe3e8"/>
      <stop offset="1" stop-color="#7d838d"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a5f"/>
      <stop offset="1" stop-color="#a3121a"/>
    </linearGradient>
    <linearGradient id="cr" x1="0" x2="1">
      <stop offset="0" stop-color="#c9a19b"/>
      <stop offset=".5" stop-color="#f5e3df"/>
      <stop offset="1" stop-color="#b9847d"/>
    </linearGradient>
  </defs>
  <!-- hastes vermelhas cruzadas -->
  <path d="M30 50 L46 58 L58 112 L52 112 Z" fill="url(#r)"/>
  <path d="M70 50 L54 58 L42 112 L48 112 Z" fill="url(#r)"/>
  <path d="M38 56 L50 70 L62 56 L58 66 L50 76 L42 66 Z" fill="#d61f2a"/>
  <!-- lâminas externas, inclinadas para fora -->
  <path d="M8 12 L26 58 L32 54 L20 24 Z" fill="url(#c2)"/>
  <path d="M92 12 L74 58 L68 54 L80 24 Z" fill="url(#c)"/>
  <!-- lâminas internas -->
  <path d="M18 10 L34 62 L42 58 L34 16 Z" fill="url(#c)"/>
  <path d="M82 10 L66 62 L58 58 L66 16 Z" fill="url(#c2)"/>
  <!-- lâmina central em escudo, com reflexo rosado -->
  <path d="M30 14 L50 18 L70 14 L64 50 L50 62 L36 50 Z" fill="url(#cr)"/>
  <path d="M36 24 L50 30 L64 24 M38 34 L50 40 L62 34 M40 44 L50 50 L60 44" stroke="#9e6a63" stroke-width="1" fill="none" opacity=".55"/>
  <path d="M50 18 L50 62" stroke="#ffffff" stroke-width="1.2" opacity=".5"/>
  <!-- base quadrada -->
  <path d="M40 110 L60 110 L62 118 L38 118 Z" fill="url(#r)"/>
  <path d="M26 118 L74 118 L80 128 L20 128 Z" fill="url(#c)"/>
  <path d="M50 118 L50 128" stroke="#e8ebef" stroke-width="1" opacity=".6"/>
  <rect x="18" y="128" width="64" height="5" rx="1.5" fill="url(#c2)"/>
</svg>
